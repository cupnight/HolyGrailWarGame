<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성배가 차는 밤 — 새 주소로 옮겼습니다</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#121019;--fg:#e8e2d4;--dim:#a39c8c;--gold:#c9a45c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;text-align:center}
h1{font-size:20px;margin:0 0 8px;color:var(--gold)}
p{margin:4px 0;color:var(--dim)}
a{color:var(--gold)}
</style>
</head>
<body>
<main>
<h1>성배가 차는 밤이 새 주소로 옮겼습니다</h1>
<p id="msg">이 기기의 기록을 함께 옮기는 중입니다…</p>
<p><a id="go" href="https://holygrailwargame.cupnight.workers.dev/">바로 가기</a></p>
</main>
<script>
(async function(){
  var NEW='https://holygrailwargame.cupnight.workers.dev/';
  function b64(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  async function pack(o){var j=JSON.stringify(o);
    try{var buf=await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return 'z'+b64(new Uint8Array(buf));}
    catch(e){return 'j'+b64(new TextEncoder().encode(j));}}
  var o={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('cupnight.')===0)o[k]=localStorage.getItem(k);}}catch(e){}
  var url=NEW;
  if(Object.keys(o).length){
    var d=await pack(o);
    if(d.length>1500000&&o['cupnight.history.v1']){delete o['cupnight.history.v1'];d=await pack(o);}
    if(d.length<=1500000)url=NEW+'#mig='+d;
  }
  try{if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();rs.forEach(function(r){r.unregister()});}}catch(e){}
  location.replace(url);
})();
</script>
</body>
</html>
